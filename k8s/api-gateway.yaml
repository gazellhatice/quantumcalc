apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: quantumcalc
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: quantumcalc/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: GRPC_SERVER_PORT, value: "9090" }
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
            - { name: ZIPKIN_ENDPOINT, value: "http://zipkin:9411/api/v2/spans" }
            - { name: CORE_MATH_ADDR, value: "dns:///core-math-service:9090" }
            - { name: ADVANCED_MATH_ADDR, value: "dns:///advanced-math-service:9090" }
            - { name: STATISTICS_ADDR, value: "dns:///statistics-service:9090" }
            - { name: HISTORY_URL, value: "http://history-service:8080" }
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: quantumcalc-secrets, key: api-key } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: quantumcalc
spec:
  type: LoadBalancer
  selector: { app: api-gateway }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
